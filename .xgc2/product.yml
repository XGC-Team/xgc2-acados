schema: xgc2.product.v1
id: xgc2-acados
name: XGC2 acados
kind: toolchain-apt
summary: System-level acados solver stack for XGC2 projects on Ubuntu 20.04, 22.04, and 24.04.

apt:
  distribution: focal,jammy,noble
  install:
    - xgc2-acados
  packages:
    - xgc2-acados
  depends:
    - libc6
    - libgcc-s1
    - libgomp1
    - libstdc++6
    - libblas-dev
    - python3
    - python3-deprecated
    - python3-matplotlib
    - python3-numpy
    - python3-pip
    - python3-scipy

usage:
  install: |
    sudo apt update
    sudo apt install xgc2-acados
  smoke_test: |
    source /opt/xgc2/acados/setup.bash
    python3 -c 'from acados_template import AcadosOcp'
  notes: |
    CMake consumers should use find_package(xgc2_acados REQUIRED CONFIG).
    MATLAB users should run /opt/xgc2/acados/setup_acados.m.

ownership:
  paths:
    - /opt/xgc2/acados
    - /usr/lib/cmake/xgc2_acados
    - /etc/ld.so.conf.d/xgc2-acados.conf

conflicts:
  apt_packages:
    - ros-noetic-xgc2-acados
