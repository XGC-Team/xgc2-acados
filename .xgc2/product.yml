schema: xgc2.product.v1
id: xgc2-acados
name: XGC2 acados
version: 0.6.0-1
kind: toolchain-apt
summary: System-level acados solver stack and Python code-generation dependencies
  for XGC2 projects on Ubuntu 18.04, 20.04, 22.04, and 24.04.
apt:
  distribution: bionic,focal,jammy,noble
  install:
  - xgc2-acados
  packages:
  - xgc2-acados
  depends:
  - libc6
  - libgcc1 | libgcc-s1
  - libgomp1
  - libstdc++6
  - libblas-dev
  - python3
  - python3-numpy
  - python3-scipy
usage:
  install: 'sudo apt update

    sudo apt install xgc2-acados

    '
  smoke_test: 'source /opt/xgc2/acados/setup.bash

    "$XGC2_ACADOS_PYTHON" -c ''from acados_template import AcadosOcp''

    '
  notes: 'CMake consumers should use find_package(xgc2_acados REQUIRED CONFIG).

    MATLAB users should run /opt/xgc2/acados/setup_acados.m.

    CasADi and its Python support modules are provided by the XGC2 build image and
    copied into the package. Product CI does not pip-install them.

    setup.bash defaults MPLBACKEND to Agg for headless robot and CI runtime.

    Code generation uses XGC2_ACADOS_PYTHON from setup.bash. Bionic ships a private
    Python 3.12.12 runtime; the system/ROS Python 3.6 remains unchanged.

    '
ownership:
  paths:
  - /opt/xgc2/acados
  - /usr/lib/cmake/xgc2_acados
  - /etc/ld.so.conf.d/xgc2-acados.conf
release:
  apt_versions:
    bionic: 0.6.0-1~bionic
    focal: 0.6.0-1~focal
    jammy: 0.6.0-1~jammy
    noble: 0.6.0-1~noble
conflicts:
  apt_packages:
  - ros-noetic-xgc2-acados
