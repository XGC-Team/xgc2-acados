name: update-acados

on:
  schedule:
    - cron: "0 2 */2 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  open-update-pr:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: noetic

      - name: Check latest acados main
        id: latest
        run: |
          set -euo pipefail
          latest_sha="$(python3 - <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen("https://api.github.com/repos/acados/acados/commits/main") as response:
              data = json.load(response)
          print(data["sha"])
          PY
          )"
          current_ref="$(sed -n 's/^ACADOS_REF=//p' acados.lock | head -n 1)"
          current_sha="$(sed -n 's/^ACADOS_SHA=//p' acados.lock | head -n 1)"
          echo "latest_sha=${latest_sha}" >> "${GITHUB_OUTPUT}"
          echo "latest_short=${latest_sha:0:12}" >> "${GITHUB_OUTPUT}"
          echo "current_ref=${current_ref}" >> "${GITHUB_OUTPUT}"
          echo "current_sha=${current_sha}" >> "${GITHUB_OUTPUT}"
          if [[ "${current_ref}" != "main" || "${latest_sha}" != "${current_sha}" ]]; then
            sed -i "s/^ACADOS_REF=.*/ACADOS_REF=main/" acados.lock
            sed -i "s/^ACADOS_SHA=.*/ACADOS_SHA=${latest_sha}/" acados.lock
          fi

      - name: Create pull request
        id: cpr
        if: steps.latest.outputs.current_ref != 'main' || steps.latest.outputs.latest_sha != steps.latest.outputs.current_sha
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/update-acados-main-${{ steps.latest.outputs.latest_short }}
          base: noetic
          title: "Update acados main to ${{ steps.latest.outputs.latest_short }}"
          commit-message: "Update acados main to ${{ steps.latest.outputs.latest_short }}"
          body: |
            Automated acados vendor update from upstream `main`.

            - Previous ref: `${{ steps.latest.outputs.current_ref }}`
            - Previous SHA: `${{ steps.latest.outputs.current_sha }}`
            - New ref: `main`
            - New SHA: `${{ steps.latest.outputs.latest_sha }}`

            This PR must pass package compliance and Noetic build/test before merge.

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" \
            --auto \
            --squash \
            --delete-branch
