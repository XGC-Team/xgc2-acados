name: ci

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  package-compliance:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check package metadata
        run: |
          git diff --check HEAD
          ./.xgc2/scripts/check_package_compliance.sh
  acados-native-c-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      ACADOS_NATIVE_TEST_JOBS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run acados native C/C++ tests
        run: |
          set -euo pipefail
          image=ghcr.io/xgc-team/xgc2-images/xgc2-build-jammy-dev:1.0.0
          docker pull "${image}"
          docker run --rm \
            -e ACADOS_NATIVE_TEST_JOBS \
            -v "${GITHUB_WORKSPACE}:/work" -w /work \
            "${image}" \
            bash -lc '
              set -euo pipefail
              git config --global --add safe.directory /work
              python3 -c "import casadi"
              ./.xgc2/scripts/test_acados_native_c.sh
            '
  deb-build-and-smoke:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-bionic-dev:1.0.0
            distribution: bionic
          - arch: arm64
            runner: ubuntu-24.04-arm
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-bionic-dev:1.0.0
            distribution: bionic
          - arch: amd64
            runner: ubuntu-latest
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-focal-dev:1.0.0
            distribution: focal
          - arch: arm64
            runner: ubuntu-24.04-arm
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-focal-dev:1.0.0
            distribution: focal
          - arch: amd64
            runner: ubuntu-latest
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-jammy-dev:1.0.0
            distribution: jammy
          - arch: arm64
            runner: ubuntu-24.04-arm
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-jammy-dev:1.0.0
            distribution: jammy
          - arch: amd64
            runner: ubuntu-latest
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-noble-dev:1.0.0
            distribution: noble
          - arch: arm64
            runner: ubuntu-24.04-arm
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-noble-dev:1.0.0
            distribution: noble
    defaults:
      run:
        shell: bash
    env:
      ACADOS_VENDOR_JOBS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Check whitespace
        run: git diff --check HEAD

      - name: Package compliance
        run: ./.xgc2/scripts/check_package_compliance.sh


      - name: Build deb and run installed smoke test
        run: |
          set -euo pipefail
          install -d .ci/build-manifests
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            -e ACADOS_VENDOR_JOBS="${ACADOS_VENDOR_JOBS}" \
            -e PACKAGE_DISTRIBUTION="${{ matrix.distribution }}" \
            "${{ matrix.image }}" \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              for pkg in \
                build-essential \
                ca-certificates \
                cmake \
                curl \
                dpkg-dev \
                fakeroot \
                file \
                git \
                libblas-dev \
                python3 \
                python3-matplotlib \
                python3-numpy \
                python3-pip \
                python3-scipy \
                python3-wrapt
              do
                if ! dpkg -s "${pkg}" >/dev/null 2>&1; then
                  echo "image is missing ${pkg}; use xgc2-build-*-dev" >&2
                  exit 1
                fi
              done
              command -v rustc >/dev/null
              command -v cargo >/dev/null
              rustc --version
              cargo --version
              python3 -c "import casadi, deprecated"
              git config --global --add safe.directory /work
              ./.xgc2/scripts/check_package_compliance.sh
              ./.xgc2/scripts/build_deb.sh
              dpkg -i ./debs/xgc2-acados_*.deb
              ./.xgc2/scripts/smoke_test_installed.sh
            '

      - name: Create trusted build manifest
        run: |
          product_version="$(awk -F': *' '/^version:/ {print $2; exit}' .xgc2/product.yml)"
          python3 .xgc2/scripts/xgc2_artifact_manifest.py build \
            --deb-dir debs \
            --output-dir .ci/build-manifests \
            --product xgc2-acados \
            --product-version "$product_version" \
            --distribution "${{ matrix.distribution }}" \
            --architecture "${{ matrix.arch }}" \
            --source-sha "$GITHUB_SHA" \
            --ci-run-id "$GITHUB_RUN_ID" \
            --ci-workflow "$GITHUB_WORKFLOW" \
            --ci-workflow-ref "$GITHUB_WORKFLOW_REF"

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-acados-${{ matrix.distribution }}-${{ matrix.arch }}
          path: |
            debs/*.deb
            .ci/build-manifests/*.json
          retention-days: 14
          include-hidden-files: true
