name: ci

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  package-compliance:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check whitespace
        run: git diff --check HEAD

      - name: Package compliance
        run: ./.xgc2/scripts/check_package_compliance.sh

  acados-native-c-tests:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    env:
      ACADOS_NATIVE_TEST_JOBS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            git \
            libblas-dev \
            libeigen3-dev \
            python3

      - name: Run acados native C/C++ tests
        run: ./.xgc2/scripts/test_acados_native_c.sh

  deb-build-and-smoke:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            image: ubuntu:18.04
            distribution: bionic
          - arch: arm64
            runner: ubuntu-24.04-arm
            image: ubuntu:18.04
            distribution: bionic
          - arch: amd64
            runner: ubuntu-latest
            image: ubuntu:20.04
            distribution: focal
          - arch: arm64
            runner: ubuntu-24.04-arm
            image: ubuntu:20.04
            distribution: focal
          - arch: amd64
            runner: ubuntu-latest
            image: ubuntu:22.04
            distribution: jammy
          - arch: arm64
            runner: ubuntu-24.04-arm
            image: ubuntu:22.04
            distribution: jammy
          - arch: amd64
            runner: ubuntu-latest
            image: ubuntu:24.04
            distribution: noble
          - arch: arm64
            runner: ubuntu-24.04-arm
            image: ubuntu:24.04
            distribution: noble
    defaults:
      run:
        shell: bash
    env:
      ACADOS_VENDOR_JOBS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build deb and run installed smoke test
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            -e ACADOS_VENDOR_JOBS="${ACADOS_VENDOR_JOBS}" \
            -e PACKAGE_DISTRIBUTION="${{ matrix.distribution }}" \
            "${{ matrix.image }}" \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential \
                ca-certificates \
                cmake \
                curl \
                dpkg-dev \
                fakeroot \
                file \
                git \
                libblas-dev \
                python3 \
                python3-matplotlib \
                python3-numpy \
                python3-pip \
                python3-scipy
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | \
                sh -s -- -y --profile minimal --default-toolchain stable
              export PATH="${HOME}/.cargo/bin:${PATH}"
              rustc --version
              cargo --version
              ./.xgc2/scripts/check_package_compliance.sh
              ./.xgc2/scripts/build_deb.sh
              apt-get install -y ./.ci/debs/xgc2-acados_*.deb
              ./.xgc2/scripts/smoke_test_installed.sh
            '

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-acados-${{ matrix.distribution }}-${{ matrix.arch }}
          path: .ci/debs/*.deb
